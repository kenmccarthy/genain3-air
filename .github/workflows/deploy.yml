name: Deploy preview to GitHub Pages
# Publishes the preview at https://<owner>.github.io/<repo>/ from main. The final site
# (https://air.genain3.ie/) is built for the root instead; see docs/deployment.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Creates a workflow-type Pages site if the repository has none yet. If the repository
      # already publishes from a branch, switch Settings → Pages → Source to "GitHub Actions".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PREVIEW: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  explain-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::If the checks passed but the deployment was rejected, check two settings: (1) Settings → Pages → Build and deployment → Source must be 'GitHub Actions'. (2) Settings → Environments → github-pages → 'Deployment branches and tags' must allow 'main'. Then re-run this workflow. https://github.com/${{ github.repository }}/settings/pages"
          exit 1
