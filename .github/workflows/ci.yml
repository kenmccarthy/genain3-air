name: CI
on:
  push:
    branches: [main]
  pull_request:
# Checks only. This repository has no deployment workflow: publishing the site is a separate,
# explicitly approved step (see docs/deployment.md).
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Accessibility (axe), import, storage-failure and navigation checks on the built site.
      - run: npm run test:e2e
